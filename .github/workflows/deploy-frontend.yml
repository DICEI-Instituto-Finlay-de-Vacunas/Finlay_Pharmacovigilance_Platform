name: Deploy frontend to Cloudflare

# Optional alternative to the Cloudflare dashboard Git integration.
# Requires the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them the job is skipped, so it never fails a push.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        if: steps.creds.outputs.enabled == 'true'

      - name: Build and deploy
        if: steps.creds.outputs.enabled == 'true'
        env:
          # Optional repository variables; .env.production provides the defaults.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FRIENDLYCAPTCHA_SITE_KEY: ${{ vars.VITE_FRIENDLYCAPTCHA_SITE_KEY }}
        run: |
          # An unset repository variable expands to an empty string; drop it so .env.production applies.
          [ -n "$VITE_API_BASE_URL" ] || unset VITE_API_BASE_URL
          npm run deploy
